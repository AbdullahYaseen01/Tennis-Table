services:
  - type: web
    name: tennis-ball-tester
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: FAST_MODE
        value: "1"
      - key: USE_YOLO
        value: "0"
